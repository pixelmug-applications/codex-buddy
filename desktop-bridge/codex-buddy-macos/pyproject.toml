[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelmug-codex"
version = "0.2.1"
description = "macOS Codex hook and UDP bridge for PixelMug"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
macos = [
  "rumps>=0.4.0",
  "pyobjc-framework-Cocoa>=10.0",
]
build = [
  "pyinstaller>=6.5",
  "rumps>=0.4.0",
  "pyobjc-framework-Cocoa>=10.0",
  "Pillow>=10.0",
]

[project.scripts]
pixelmug-codex = "src.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src"]

[tool.setuptools.data-files]
"share/pixelmug-codex/assets" = [
  "assets/status-icon.png",
  "assets/status-icon@2x.png",
]
