[project]
name = "pixelmug-codex-buddy"
version = "0.2.1"
description = "Windows buddy bridge and Codex hook for PixelMug Codex status display"
requires-python = ">=3.10"
dependencies = [
  "pystray==0.19.5",
  "Pillow>=10.0.0"
]

[project.scripts]
pixelmug-codex-cli = "pixelmug_codex_host.cli:main"
pixelmug-codex-hook = "pixelmug_codex_host.hook:main"
pixelmug-codex-buddy = "pixelmug_codex_host.bridge:main"

[tool.ruff]
line-length = 120


